name: Check monitors

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check enabled monitors
        id: check
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 src/tripwire.py

      - name: Persist monitor state
        run: |
          git config user.name "tripwire[bot]"
          git config user.email "tripwire[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git push

      - name: Report monitor failures
        if: steps.check.outcome == 'failure'
        run: exit 1
